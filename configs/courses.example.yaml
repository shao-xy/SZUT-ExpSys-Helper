# 排课计划示例
#
# 复制为 configs/courses.yaml 后按实际情况填写。
# 完整字段说明见 labreg/templates/courses.yaml.template。
courses:
  - name: 示例课程
    course_code: "00000000"
    classes:
      - name: 示例课程-0001A
        weekday: 星期四
        start_period: 3
        end_period: 4
        room: N0000
        batches: 1
        # 单双周：每周（默认）/ 单周 / 双周；可留空
        parity: 每周
        experiments:
          - project: 示例实验一
            weeks: [1, 3]
          - project: 示例实验二
            weeks: [4, 7]
          # 也可以单独指定单双周
          - project: 示例实验三
            weeks: [9, 15]
            parity: 单周
